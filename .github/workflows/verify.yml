          lake exe certificate ordinary-observe runtime/Heap.hs /tmp/Extent.hs 512 5 /tmp/extent.out /tmp/extentast/0.json &&
          sed "s/vlaExtent 4 \[/vlaExtent 8 [/" /tmp/Extent.hs >/tmp/WrongExtent.hs &&
          ! lake exe certificate ordinary runtime/Heap.hs /tmp/extentast/0.json /tmp/WrongExtent.hs &&
          dune exec --profile release -- heresy test/captured.c --certificate .lake/build/bin/certificate -o /tmp/Captured.hs --ast-dir /tmp/capturedast --build /tmp/captured &&
