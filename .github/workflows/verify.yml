name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build -f Containerfile -t heresy .
      - run: docker run --rm --network none heresy
      - run: >-
          docker run --rm --network none heresy sh -eu -c
          '"$FILCC" -std=c11 -fsyntax-only -Xclang -ast-dump=json examples/machine.c > /tmp/machine.json &&
          dune exec --profile release -- heresy examples/machine.c -o /tmp/Machine.hs &&
          lake exe certificate /tmp/machine.json /tmp/Machine.hs &&
          sed "/^f_.* = at /s/(number a0)/0/" /tmp/Machine.hs > /tmp/ChangedKernel.hs &&
          ! lake exe certificate /tmp/machine.json /tmp/ChangedKernel.hs &&
          dune exec --profile release -- heresy test/values.c -o /tmp/Values.hs --ast-dir /tmp/values &&
          lake exe certificate dispatch /tmp/Values.hs &&
          sed "s/^      _ -> advance >> loop condition body advance$/      _ -> loop condition body advance/" /tmp/Values.hs > /tmp/ChangedLoop.hs &&
          ! lake exe certificate dispatch /tmp/ChangedLoop.hs &&
          sed -E "/^g_.* = /s/]\)$/, []])/" /tmp/Values.hs > /tmp/ChangedGraph.hs &&
          ! lake exe certificate dispatch /tmp/ChangedGraph.hs &&
          lake exe certificate memory /tmp/Values.hs &&
          lake exe certificate process /tmp/Values.hs &&
          lake exe certificate linkage /tmp/Values.hs /tmp/values/0.json &&
          dune exec --profile release -- heresy test/linkage/entry.c test/linkage/worker.c -o /tmp/Linkage.hs --ast-dir /tmp/units --build /tmp/linked &&
          lake exe certificate linkage /tmp/Linkage.hs /tmp/units/0.json /tmp/units/1.json &&
          test "$(/tmp/linked)" = "linkage 4 18 42 18 9 1" &&
          ! lake exe certificate linkage /tmp/Linkage.hs /tmp/units/1.json /tmp/units/0.json &&
          sed "/^main = execute/s/] True (/] False (/" /tmp/Linkage.hs > /tmp/Disabled.hs &&
          ! lake exe certificate linkage /tmp/Disabled.hs /tmp/units/0.json /tmp/units/1.json &&
          "$FILCC" -std=c11 -fsyntax-only -Xclang -ast-dump=json test/closed.c > /tmp/closed.json &&
          dune exec --profile release -- heresy test/closed.c --closed -o /tmp/Closed.hs &&
          lake exe certificate program /tmp/closed.json /tmp/Closed.hs &&
          "$FILCC" -std=c11 -fsyntax-only -Xclang -ast-dump=json test/slots.c > /tmp/slots.json &&
          dune exec --profile release -- heresy test/slots.c --closed -o /tmp/Slots.hs &&
          lake exe certificate program /tmp/slots.json /tmp/Slots.hs &&
          "$FILCC" -std=c11 -fsyntax-only -Xclang -ast-dump=json test/helpers.c > /tmp/helpers.json &&
          dune exec --profile release -- heresy test/helpers.c --closed -o /tmp/Helpers.hs &&
          lake exe certificate program /tmp/helpers.json /tmp/Helpers.hs &&
          "$FILCC" -std=c11 -fsyntax-only -Xclang -ast-dump=json test/frames.c > /tmp/frames.json &&
          dune exec --profile release -- heresy test/frames.c --closed -o /tmp/Frames.hs &&
          lake exe certificate program /tmp/frames.json /tmp/Frames.hs &&
          "$FILCC" -std=c11 -fsyntax-only -Xclang -ast-dump=json test/recursive.c > /tmp/recursive.json &&
          dune exec --profile release -- heresy test/recursive.c --closed -o /tmp/Recursive.hs &&
          lake exe certificate program /tmp/recursive.json /tmp/Recursive.hs'
      - run: >-
          docker run --rm --network none heresy sh -c
          'dune exec --profile release tools/release.exe -- /tmp/first &&
          dune exec --profile release tools/release.exe -- /tmp/second &&
          cmp /tmp/first/checksums.txt /tmp/second/checksums.txt &&
          cd /tmp/first && sha256sum -c checksums.txt &&
          tar -xzf heresy.tar.gz && ./heresy/bin/heresy --version'
