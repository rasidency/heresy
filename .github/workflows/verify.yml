          ! lake exe certificate ordinary runtime/Heap.hs /tmp/arithmeticast/0.json /tmp/WrongArithmetic.hs &&
          dune exec --profile release -- heresy test/extents.c --certificate .lake/build/bin/certificate -o /tmp/Extent.hs --ast-dir /tmp/extentast --build /tmp/extent &&
          "$FILCC" -std=c11 -O1 test/extents.c -o /tmp/extentref &&
