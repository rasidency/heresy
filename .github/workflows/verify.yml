          test "$(cat /tmp/captured.out)" = AADCBEF && cmp /tmp/captured.out /tmp/capturedref.out &&
          lake exe certificate ordinary-observe runtime/Heap.hs /tmp/Captured.hs 2048 0 /tmp/captured.out /tmp/capturedast/0.json &&
          status=0 && { /tmp/captured fault >/tmp/capturedfault.out 2>/tmp/capturedfault.err || status=$?; } &&
          test "$status" -eq 70 && grep -q "nonpositive variable-length array bound" /tmp/capturedfault.err &&
          cmp /tmp/captured.out /tmp/capturedfault.out &&
          printf "%s\000%s\000" /tmp/captured fault >/tmp/captured.argv &&
          lake exe certificate ordinary-observe-argv runtime/Heap.hs /tmp/Captured.hs 2048 70 /tmp/capturedfault.out /tmp/captured.argv /tmp/capturedast/0.json &&
          sed "s/vlaIndex 2 /vlaIndex 1 /" /tmp/Captured.hs >/tmp/WrongRank.hs &&
          ! lake exe certificate ordinary runtime/Heap.hs /tmp/capturedast/0.json /tmp/WrongRank.hs &&
          dune exec --profile release -- heresy test/parameters.c test/linkage/shape.c --certificate .lake/build/bin/certificate -o /tmp/Parameters.hs --ast-dir /tmp/parametersast --build /tmp/parameters &&
          "$FILCC" -std=c11 -O1 test/parameters.c test/linkage/shape.c -o /tmp/parametersref &&
          /tmp/parameters >/tmp/parameters.out && /tmp/parametersref >/tmp/parametersref.out &&
          cmp /tmp/parameters.out /tmp/parametersref.out &&
          lake exe certificate ordinary-observe runtime/Heap.hs /tmp/Parameters.hs 1024 0 /tmp/parameters.out /tmp/parametersast/0.json /tmp/parametersast/1.json &&
          sed "s/vlaBind 1 p 4/vlaBind 0 p 4/" /tmp/Parameters.hs >/tmp/WrongAdjustment.hs &&
          ! lake exe certificate ordinary-link runtime/Heap.hs /tmp/WrongAdjustment.hs /tmp/parametersast/0.json /tmp/parametersast/1.json &&
          dune exec --profile release -- heresy test/packets.c test/linkage/packet.c --certificate .lake/build/bin/certificate -o /tmp/Packets.hs --ast-dir /tmp/packetsast --build /tmp/packets &&
          "$FILCC" -std=c11 -O1 test/packets.c test/linkage/packet.c -o /tmp/packetsref &&
          /tmp/packets >/tmp/packets.out && /tmp/packetsref >/tmp/packetsref.out &&
          test "$(cat /tmp/packets.out)" = ABC && cmp /tmp/packets.out /tmp/packetsref.out &&
          lake exe certificate ordinary-observe runtime/Heap.hs /tmp/Packets.hs 1024 0 /tmp/packets.out /tmp/packetsast/0.json /tmp/packetsast/1.json &&
          status=0 && { /tmp/packets fault >/tmp/packetsfault.out 2>/tmp/packetsfault.err || status=$?; } &&
          test "$status" -eq 70 && grep -q "use after free" /tmp/packetsfault.err &&
          cmp /tmp/packets.out /tmp/packetsfault.out &&
          printf "%s\000%s\000" /tmp/packets fault >/tmp/packets.argv &&
          lake exe certificate ordinary-observe-argv runtime/Heap.hs /tmp/Packets.hs 1024 70 /tmp/packetsfault.out /tmp/packets.argv /tmp/packetsast/0.json /tmp/packetsast/1.json &&
          sed "/^f_/s/(AggregateType 16 8)/(AggregateType 8 8)/" /tmp/Packets.hs >/tmp/WrongPackets.hs &&
          ! lake exe certificate ordinary-link runtime/Heap.hs /tmp/WrongPackets.hs /tmp/packetsast/0.json /tmp/packetsast/1.json &&
          dune exec --profile release -- heresy test/varargs.c --certificate .lake/build/bin/certificate -o /tmp/Varargs.hs --ast-dir /tmp/varargsast --build /tmp/varargs &&
          "$FILCC" -std=c11 -O1 test/varargs.c -o /tmp/varargsref &&
