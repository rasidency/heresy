name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: docker build -f Containerfile -t heresy .
      - run: docker run --rm --network none heresy
      - run: >-
          docker run --rm --network none heresy sh -c
          'dune exec --profile release tools/release.exe -- /tmp/first &&
          dune exec --profile release tools/release.exe -- /tmp/second &&
          cmp /tmp/first/checksums.txt /tmp/second/checksums.txt &&
          root=$PWD && cd /tmp/first && sha256sum -c checksums.txt &&
          tar -xzf heresy.tar.gz && mkdir source && tar -C source -xzf source.tar.gz &&
          (cd "$root" && for f in examples/*.c test/*.c test/linkage/*.[ch]; do cmp "$f" "/tmp/first/source/$f" || exit 1; done) &&
          diff -r heresy/proof source/proof && cmp heresy/runtime/Heap.hs source/runtime/Heap.hs &&
          (cd source && dune build --profile release @all && dune runtest --profile release) &&
          cd heresy && ./bin/heresy --version &&
          ./bin/heresy ../source/test/closed.c --closed --native --certificate ./bin/certificate --build /tmp/released &&
          ./bin/heresy ../source/test/closed.c --closed --native --certificate ./bin/certificate --verify-artifact /tmp/released &&
          ./bin/heresy ../source/test/atomics.c --certificate ./bin/certificate --observe 4096 --build /tmp/atomic &&
          /tmp/atomic >/tmp/atomic.out &&
          test "$(cat /tmp/atomic.out)" = "2147483647 -2147483648 7 4 4 5 3 16" &&
          ./bin/heresy ../source/test/transfers.c --certificate ./bin/certificate --observe 1024 --build /tmp/control &&
          /tmp/control >/tmp/control.out && test "$(cat /tmp/control.out)" = "17 41" &&
          lake build'
